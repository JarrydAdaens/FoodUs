name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # A tag that disagrees with the shipped versionName would reintroduce the
      # Obtainium phantom-update bug, so fail fast before spending build minutes.
      - name: Verify tag matches fork-version-name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          FORK_VERSION=$(sed -n 's/^fork-version-name = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          if [ "$GITHUB_REF_NAME" != "v${FORK_VERSION}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match fork-version-name v${FORK_VERSION}" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Android SDK build tools
        run: |
          $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Align and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          echo "Aligning APK..."

          zipalign -f -p -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          echo "Signing APK with keystore..."

          apksigner sign \
            --alignment-preserved \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --out signed.apk \
            aligned.apk

          echo "APK signed successfully."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv signed.apk "FoodUs-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "FoodUs-${GITHUB_REF_NAME}.apk" \
            --generate-notes

      - name: Upload signed APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: signed.apk
          if-no-files-found: error
          retention-days: 30
